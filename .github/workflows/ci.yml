name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  shellcheck:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: shellcheck all scripts
        run: |
          shellcheck --version
          git ls-files '*.sh' 'project3-azure-ops-toolkit/tests/mocks/*' | xargs shellcheck -x

  tests:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: project1 and project2 smoke test
        run: |
          ./project1/system_monitor.sh -l "$RUNNER_TEMP/monitor.log" -s
          ./project2/system_info.sh --no-color
      - name: project3 offline tests (mock az and kubectl)
        run: ./project3-azure-ops-toolkit/tests/run-tests.sh
      - name: project4 backup tests
        run: ./project4-backup-with-verification/tests/run-tests.sh
